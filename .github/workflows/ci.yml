name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Reaproveitado pelo release.yml: a mesma matriz roda antes de publicar uma tag.
  workflow_call:

jobs:
  test:
    name: Testes do CLI (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verificar que .agents/manifest.json está em dia
        run: npm run verify:manifest

      # Inclui o teste que empacota o projeto (npm pack), instala o pacote e
      # roda o CLI instalado — o que o usuário recebe pelo npx.
      - name: Rodar testes (node --test)
        run: npm test
