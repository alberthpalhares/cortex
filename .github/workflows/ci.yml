name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Testes do CLI (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verificar que .agents/manifest.json está em dia
        run: npm run verify:manifest

      - name: Rodar testes (node --test)
        run: npm test
